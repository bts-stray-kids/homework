<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form">
        <h3>Ваши личные данные</h3>
        <fieldset class="form-group-title">
            <label class="label">
                Ваше имя
                <input type="text" placeholder="Имя" name="name" required>
            </label>
            <label class="label">
                Ваш возраст
                <input type="number" placeholder="Возраст" name="age" required>
            </label>
            <label class="label">
                Номер телефона
                <input type="tel" placeholder="Номер телефона" name="phone" required>
            </label>
            <label class="label">
                Почта
                <input type="email" placeholder="Почта" name="email" required>
            </label>
        </fieldset>
        <fieldset class="form-group">
            <label class="label">
                Сообщение 
                <textarea name="massage" placeholder="Ваше сообщение"></textarea>
            </label>
        </fieldset>
        <label class="label">
            <input class="check" type="checkbox" name="rules" required>
            Я принимаю правила
        </label>
        <button class="button" type="submit">Отправить</button>
    </form>
</body>
</html>
